<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>語音輸入 · 跨 App 測試</title><link rel="stylesheet" href="mac-input-check.css"></head>
<body><main><p class="eyebrow">語音輸入 · MAC</p><h1>把話說進文字欄位。</h1><p>先點第一個欄位，按住 <strong>Control＋Option＋空白鍵</strong> 說話，說完放開。這頁不會發送訊息，也不會儲存欄位內容。</p><label for="first">第一個欄位</label><textarea id="first" placeholder="在這裡試一段中英夾雜口述，例如：這個 deadline 改到 Friday，先不要 publish。"></textarea><label for="second">第二個欄位 · 測試焦點保護</label><textarea id="second" placeholder="另一輪錄音放開後，立刻點這裡。工具應顯示複製按鈕，不應把文字自動填入這個欄位。"></textarea><p class="note">如果自動填入未成功，結果仍保留於選單列的「複製最近結果」與語音實驗室歷史紀錄。重新整理會清空這頁內容。</p></main></body></html>
