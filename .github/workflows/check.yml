name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: brew install ffmpeg
      - run: npm ci
      - run: npm run check
      - run: bash macos/scripts/test.sh
      - run: bash macos/scripts/build.sh
      - run: bash macos/scripts/check-app.sh
      - run: python3 scripts/test-release.py
      - run: python3 scripts/release.py
      - run: /usr/bin/python3 scripts/build-standalone.py
      - run: /usr/bin/python3 scripts/check-standalone.py
